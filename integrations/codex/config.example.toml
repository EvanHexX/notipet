# notipet <-> Codex CLI
#
# Prefer the notipet Codex plugin (integrations/codex/plugin, see
# docs/modules/codex_plugin.md): it brings these same hooks and the skill, and
# needs no edit here. Use this file only without the plugin - never both, or
# Codex runs every hook twice.
#
# Append this to %USERPROFILE%\.codex\config.toml and fix the paths.
#
# `command` is a whole command line (cmd.exe /C on Windows). Codex has no
# `args` field and silently ignores one, so arguments go in `command`.
#
# ---------------------------------------------------------------------------
# Do NOT touch an existing `notify = [...]` line.
# ---------------------------------------------------------------------------
# `notify` is a single slot. On this machine it is already held by Codex's own
# computer-use integration, and overwriting it would silently break that. Use
# the hooks below instead, which are additive.
#
# Hooks are better here on every axis anyway:
#
#   - `notify` has exactly one event, agent-turn-complete. The request to add a
#     "waiting for user input" event was closed as not planned, so notify can
#     never tell you the agent is blocked on you - which is the alert worth
#     having.
#   - Hooks deliver the payload on stdin, so it shares a parser with Claude Code.
#     `notify` appends it as the final argv element, and openai/codex#25141
#     (still open) lets that payload grow with the whole prompt history until it
#     exceeds the Windows command-line limit.
#   - Hooks give PermissionRequest.
#
# notipet still understands the legacy `notify` payload shape, so if you would
# rather use that slot it works - it just tells you less.

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = '"C:\src\notipet\bin\notipet.exe" --source codex'
timeout = 10

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = '"C:\src\notipet\bin\notipet.exe" --source codex'
timeout = 10

# Ends alarms that are over: the last turn's "finished" once a new prompt
# starts. (Stop above already ends this thread's PermissionRequest alarm.)
# async: the prompt never waits for notipet.
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '"C:\src\notipet\bin\notipet.exe" --source codex'
timeout = 10
async = true

# Optional: the terminal's own bell, independent of notipet. No program runs,
# so notipet cannot hook it - listed only so the two are not confused.
# [tui]
# notifications = true
# notification_method = "auto"
# notification_condition = "unfocused"
